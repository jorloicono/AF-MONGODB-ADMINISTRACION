# =============================================================================
#  mongod.conf del Día 1 (formato YAML: ¡usad espacios, nunca tabuladores!)
#  Documentación: https://www.mongodb.com/docs/manual/reference/configuration-options/
# =============================================================================

storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      # En contenedores conviene fijar la caché de forma explícita
      cacheSizeGB: 0.5

net:
  port: 27017
  bindIp: 0.0.0.0          # en producción: solo las IPs necesarias

# Sin "path", el log sale por la salida estándar (docker compose logs solo)
systemLog:
  verbosity: 0

operationProfiling:
  mode: "off"
  slowOpThresholdMs: 100

# --- Laboratorio 04: descomenta estas dos líneas para activar la autenticación
#security:
#  authorization: enabled
